<h1>Search Books</h1>

<input
  type="text"
  [(ngModel)]="searchText"
  placeholder="Enter book title">

<button (click)="searchBooks()">

  Search

</button>

<br><br>

<p>Total Results: {{ books.length }}</p>

<ul>

  <li *ngFor="let book of books">

    {{ book.title }}
    -
    {{ book.author }}
    -
    {{ book.category }}

  </li>

</ul>
